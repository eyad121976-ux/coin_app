name: Build Android APK

# تشغيل يدوي فقط: من تبويب Actions في المستودع اضغط "Run workflow".
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: فك ضغط ملفات المشروع (إن وُجد ملف zip في جذر المستودع)
        run: |
          shopt -s nullglob
          zips=(*.zip)
          if [ ${#zips[@]} -gt 0 ]; then unzip -o "${zips[0]}" -d .; fi

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: قبول تراخيص Android SDK
        run: yes | sdkmanager --licenses || true

      - name: تثبيت حزم مشروع Capacitor
        working-directory: mobile
        run: npm install

      - name: نسخ صفحات الموقع الثابتة إلى التطبيق
        working-directory: mobile
        run: npm run sync:web

      - name: إضافة منصة أندرويد
        working-directory: mobile
        run: npx cap add android

      - name: مزامنة الإضافات (Capacitor plugins)
        working-directory: mobile
        run: npx cap sync android

      - name: إعداد معرّف AdMob في المشروع
        working-directory: mobile
        env:
          ADMOB_APP_ID: ${{ vars.ADMOB_APP_ID }}
        run: node scripts/patch-manifest.js

      - name: بناء ملف APK (تجريبي/debug)
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: رفع APK كمرفق للتحميل
        uses: actions/upload-artifact@v4
        with:
          name: coin-merge-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
